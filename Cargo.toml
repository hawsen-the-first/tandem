[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ports",
    "crates/app",
    "crates/support",
    "crates/config",
    "crates/credentials",
    "crates/store-postgres",
    "crates/vault",
    "crates/providers",
    "crates/telemetry",
    "crates/bootstrap",
    "apps/api",
    "apps/worker",
    "apps/cli",
    "tools/breach-filter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/hawsen-the-first/tandem"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
