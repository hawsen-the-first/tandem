[package]
name = "tandem-telemetry"
description = "Structured logging with redaction, tracing, metrics registry and health types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
serde_json = "1.0.154"
tandem-support = { version = "0.1.0", path = "../support" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["time", "rt", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["registry", "env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "test-util"] }
