[package]
name = "tandem-credentials"
description = "Argon2id hasher pool, breached-password checker, TOTP and recovery codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
data-encoding = "2.11.1"
hmac = "0.13.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tandem-core = { version = "0.1.0", path = "../core" }
tandem-ports = { version = "0.1.0", path = "../ports" }
tandem-support = { version = "0.1.0", path = "../support" }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros", "time"] }
