[package]
name = "tandem-store-postgres"
description = "PostgreSQL migrations, repositories, job queue, outbox and schema guard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

build = "build.rs"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
tandem-core = { version = "0.1.0", path = "../core" }
tandem-ports = { version = "0.1.0", path = "../ports" }
tandem-support = { version = "0.1.0", path = "../support" }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = "1.29.2"
