[package]
name = "tandem-app"
description = "Application services (use cases) over the ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
tandem-core = { version = "0.1.0", path = "../core" }
tandem-providers = { version = "0.1.0", path = "../providers", optional = true }
tandem-ports = { version = "0.1.0", path = "../ports" }
tandem-support = { version = "0.1.0", path = "../support" }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["sync"], optional = true }
tracing = "0.1.44"

[dev-dependencies]
tandem-providers = { version = "0.1.0", path = "../providers" }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "test-util"] }

[features]
testing = ["dep:tokio", "dep:tandem-providers"]
