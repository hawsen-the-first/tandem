[package]
name = "tandem-support"
description = "Clock and random-source traits, circuit breaker, backoff and supervised tasks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros", "time"] }
