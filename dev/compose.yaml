# Development dependencies for Tandem. The api and worker run natively (see justfile).
# Variables come from dev/.env (generated by `just dev-init`); nothing secret is committed.
name: tandem-dev

services:
  certgen:
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "/certgen/generate.sh"]
    volumes:
      - ./certgen/generate.sh:/certgen/generate.sh:ro
      - ./secrets/certs:/certs
    restart: "no"
    networks: [tandem_dev]

  db:
    image: postgres:18.6
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: tandem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run just dev-init}
      TANDEM_MIGRATE_PASSWORD: ${TANDEM_MIGRATE_PASSWORD:?run just dev-init}
      TANDEM_APP_PASSWORD: ${TANDEM_APP_PASSWORD:?run just dev-init}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql
      - ./secrets/certs:/certs:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${TANDEM_DEV_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=tandem"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [tandem_dev]

volumes:
  pgdata:

networks:
  tandem_dev:
    driver: bridge
