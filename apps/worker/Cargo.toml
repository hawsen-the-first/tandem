[package]
name = "tandem-worker"
description = "Job runner, outbox relay and cleanup (worker service)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tandem-worker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
metrics = "0.24.6"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tandem-app = { version = "0.1.0", path = "../../crates/app" }
tandem-config = { version = "0.1.0", path = "../../crates/config" }
tandem-bootstrap = { version = "0.1.0", path = "../../crates/bootstrap" }
tandem-store-postgres = { version = "0.1.0", path = "../../crates/store-postgres" }
tandem-support = { version = "0.1.0", path = "../../crates/support" }
tandem-telemetry = { version = "0.1.0", path = "../../crates/telemetry" }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tracing = "0.1.44"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tandem-core = { version = "0.1.0", path = "../../crates/core" }
tandem-ports = { version = "0.1.0", path = "../../crates/ports" }
tempfile = "3.27.0"
