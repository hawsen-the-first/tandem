[package]
name = "tandem-cli"
description = "Operations CLI: migrations, vault rekey, admin recovery, audit prune."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tandem"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tandem-app = { version = "0.1.0", path = "../../crates/app" }
tandem-config = { version = "0.1.0", path = "../../crates/config" }
tandem-bootstrap = { version = "0.1.0", path = "../../crates/bootstrap" }
tandem-store-postgres = { version = "0.1.0", path = "../../crates/store-postgres" }
tandem-vault = { version = "0.1.0", path = "../../crates/vault" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tandem-core = { version = "0.1.0", path = "../../crates/core" }
tandem-ports = { version = "0.1.0", path = "../../crates/ports" }
tandem-support = { version = "0.1.0", path = "../../crates/support" }
tempfile = "3.27.0"
