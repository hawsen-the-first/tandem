[package]
name = "tandem-api"
description = "HTTP and WebSocket server (api service)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tandem-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tandem-app = { version = "0.1.0", path = "../../crates/app" }
tandem-config = { version = "0.1.0", path = "../../crates/config" }
tandem-core = { version = "0.1.0", path = "../../crates/core" }
tandem-ports = { version = "0.1.0", path = "../../crates/ports" }
tandem-bootstrap = { version = "0.1.0", path = "../../crates/bootstrap" }
tandem-support = { version = "0.1.0", path = "../../crates/support" }
tandem-telemetry = { version = "0.1.0", path = "../../crates/telemetry" }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit", "catch-panic", "timeout", "fs"] }
tracing = "0.1.44"
utoipa = "6.0.0"

[dev-dependencies]
tandem-store-postgres = { version = "0.1.0", path = "../../crates/store-postgres" }
data-encoding = "2.11.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hmac = "0.13.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
sha1 = "0.11.0"
tandem-app = { version = "0.1.0", path = "../../crates/app", features = ["testing"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
